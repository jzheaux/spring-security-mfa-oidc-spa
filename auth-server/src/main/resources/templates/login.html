<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Please sign in</title>
    <link href="/default-ui.css" rel="stylesheet" />
</head>
<body>
<div class="content">
    <form th:action="@{/login}" method="post" class="login-form">
        <h2>Please sign in</h2>
        <p th:if="${param.error}" class="error">Wrong user or password</p>
        <p>
            <label for="username" class="screenreader">Username</label>
            <input type="text" id="username" name="username" placeholder="Username" autofocus required />
        </p>
        <p>
            <label for="password" class="screenreader">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" autofocus required />
        </p>
        <button type="submit" class="primary">Sign in</button>
    </form>
</div>
</body>
</html>
