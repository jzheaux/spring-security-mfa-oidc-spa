<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>One-Time Token Login</title>
    <link rel="stylesheet" href="/default-ui.css" />
</head>
<body>
<div class="container">
    <form th:action="@{/ott/generate}" method="post">
        <!-- Include CSRF token if CSRF protection is enabled for this form -->
        <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> -->
        <input type="hidden" name="username" th:value="${username}"/>
        <button type="submit" class="btn btn-primary">Verify Token</button>
    </form>

</div>
<script>
    setTimeout(() => {
      document.forms[0].submit();
    }, 100);
</script>
</body>
</html>
